name: news-to-mastodon

on:
  schedule:
    - cron: "0,30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-to-mastodon
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          MASTODON_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_VISIBILITY: unlisted
          POST_TZ: Europe/Moscow
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_URL: ${{ secrets.GROQ_URL }}
          GROQ_MODEL: qwen/qwen3.8-27b
          GROQ_MAX_OUTPUT_TOKENS: "800"
        run: python main.py

      - name: Commit state updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json || true
          git commit -m "Update state $(date -u +'%Y-%m-%dT%H:%M:%SZ')" || echo "No state changes"
          git push
